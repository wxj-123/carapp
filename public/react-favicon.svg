<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="react-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- React原子核心 -->
  <circle cx="16" cy="16" r="4" fill="url(#react-gradient)"/>
  
  <!-- React轨道 -->
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="url(#react-gradient)" stroke-width="1.5" transform="rotate(0 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="url(#react-gradient)" stroke-width="1.5" transform="rotate(60 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="url(#react-gradient)" stroke-width="1.5" transform="rotate(120 16 16)"/>
  
  <!-- 装饰性原子点 -->
  <circle cx="16" cy="4" r="1.5" fill="#61dafb"/>
  <circle cx="26" cy="10" r="1.5" fill="#61dafb"/>
  <circle cx="26" cy="22" r="1.5" fill="#61dafb"/>
  <circle cx="16" cy="28" r="1.5" fill="#61dafb"/>
  <circle cx="6" cy="22" r="1.5" fill="#61dafb"/>
  <circle cx="6" cy="10" r="1.5" fill="#61dafb"/>
</svg>