<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="car-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#car-gradient)"/>
  
  <!-- Car body -->
  <rect x="150" y="250" width="500" height="100" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Car roof -->
  <path d="M200 250 Q300 180 400 180 Q500 180 550 250" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Windows -->
  <rect x="220" y="200" width="80" height="50" rx="5" fill="#93c5fd" opacity="0.7"/>
  <rect x="320" y="200" width="120" height="50" rx="5" fill="#93c5fd" opacity="0.7"/>
  <rect x="460" y="200" width="60" height="50" rx="5" fill="#93c5fd" opacity="0.7"/>
  
  <!-- Wheels -->
  <circle cx="250" cy="370" r="40" fill="#1e293b"/>
  <circle cx="250" cy="370" r="25" fill="#f8fafc"/>
  <circle cx="550" cy="370" r="40" fill="#1e293b"/>
  <circle cx="550" cy="370" r="25" fill="#f8fafc"/>
  
  <!-- Headlights -->
  <circle cx="160" cy="280" r="15" fill="#fbbf24"/>
  <circle cx="160" cy="320" r="15" fill="#fbbf24"/>
  
  <!-- Taillights -->
  <circle cx="640" cy="280" r="15" fill="#ef4444"/>
  <circle cx="640" cy="320" r="15" fill="#ef4444"/>
  
  <!-- Brand text -->
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b" text-anchor="middle">豪华轿车</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="150" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="200" cy="80" r="3" fill="#ffffff" opacity="0.3"/>
</svg>