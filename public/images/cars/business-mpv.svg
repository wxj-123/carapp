<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mpv-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#mpv-gradient)"/>
  
  <!-- MPV body (boxy design) -->
  <rect x="50" y="120" width="300" height="100" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- MPV roof -->
  <path d="M80 120 Q150 80 200 80 Q250 80 320 120" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Large windows -->
  <rect x="90" y="90" width="70" height="30" rx="3" fill="#c4b5fd" opacity="0.7"/>
  <rect x="170" y="90" width="90" height="30" rx="3" fill="#c4b5fd" opacity="0.7"/>
  <rect x="270" y="90" width="50" height="30" rx="3" fill="#c4b5fd" opacity="0.7"/>
  
  <!-- Sliding doors (MPV feature) -->
  <rect x="130" y="120" width="5" height="100" fill="#94a3b8"/>
  <rect x="250" y="120" width="5" height="100" fill="#94a3b8"/>
  
  <!-- Wheels -->
  <circle cx="110" cy="235" r="25" fill="#1e293b"/>
  <circle cx="110" cy="235" r="15" fill="#f8fafc"/>
  <circle cx="290" cy="235" r="25" fill="#1e293b"/>
  <circle cx="290" cy="235" r="15" fill="#f8fafc"/>
  
  <!-- Wheel arches -->
  <rect x="85" y="215" width="50" height="15" rx="7" fill="#e2e8f0"/>
  <rect x="265" y="215" width="50" height="15" rx="7" fill="#e2e8f0"/>
  
  <!-- Headlights -->
  <rect x="55" y="140" width="15" height="20" rx="3" fill="#fbbf24"/>
  <rect x="55" y="170" width="15" height="20" rx="3" fill="#fbbf24"/>
  
  <!-- Taillights -->
  <rect x="330" y="140" width="15" height="20" rx="3" fill="#ef4444"/>
  <rect x="330" y="170" width="15" height="20" rx="3" fill="#ef4444"/>
  
  <!-- Brand text -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">商务MPV</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="60" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="370" cy="80" r="4" fill="#ffffff" opacity="0.3"/>
</svg>