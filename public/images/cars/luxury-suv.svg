<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="suv-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#suv-gradient)"/>
  
  <!-- SUV body -->
  <rect x="120" y="220" width="560" height="130" rx="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- SUV roof -->
  <path d="M180 220 Q300 150 400 150 Q520 150 580 220" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Windows -->
  <rect x="200" y="170" width="100" height="50" rx="5" fill="#6ee7b7" opacity="0.7"/>
  <rect x="320" y="170" width="140" height="50" rx="5" fill="#6ee7b7" opacity="0.7"/>
  <rect x="480" y="170" width="80" height="50" rx="5" fill="#6ee7b7" opacity="0.7"/>
  
  <!-- Wheels -->
  <circle cx="230" cy="370" r="45" fill="#1e293b"/>
  <circle cx="230" cy="370" r="28" fill="#f8fafc"/>
  <circle cx="570" cy="370" r="45" fill="#1e293b"/>
  <circle cx="570" cy="370" r="28" fill="#f8fafc"/>
  
  <!-- Wheel arches -->
  <rect x="190" y="325" width="80" height="30" rx="15" fill="#e2e8f0"/>
  <rect x="530" y="325" width="80" height="30" rx="15" fill="#e2e8f0"/>
  
  <!-- Headlights -->
  <rect x="130" y="250" width="20" height="25" rx="5" fill="#fbbf24"/>
  <rect x="130" y="290" width="20" height="25" rx="5" fill="#fbbf24"/>
  
  <!-- Taillights -->
  <rect x="650" y="250" width="20" height="25" rx="5" fill="#ef4444"/>
  <rect x="650" y="290" width="20" height="25" rx="5" fill="#ef4444"/>
  
  <!-- Spare tire mount -->
  <rect x="680" y="240" width="15" height="40" fill="#94a3b8"/>
  <circle cx="687" cy="260" r="12" fill="#1e293b"/>
  <circle cx="687" cy="260" r="7" fill="#f8fafc"/>
  
  <!-- Brand text -->
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#065f46" text-anchor="middle">豪华SUV</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="120" r="6" fill="#ffffff" opacity="0.3"/>
  <circle cx="720" cy="100" r="4" fill="#ffffff" opacity="0.3"/>
</svg>